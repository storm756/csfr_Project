; Settings Moodle needs (the same ones to request on Hostinger).
max_input_vars = 5000
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

; The code is mounted from the Windows D: drive, which is slow to scan,
; so cache compiled PHP and file paths for longer.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 30
realpath_cache_size = 4096K
realpath_cache_ttl = 600
